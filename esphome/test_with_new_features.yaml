# Test configuration with all new features from alt_impl_2
# This config includes flow control pin, display control, and improved error handling

substitutions:
  device_name: hisense-ac-full
  friendly_name: "Hisense AC Full"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  
  on_boot:
    priority: -100
    then:
      - logger.log: "Device booted with all new features enabled"

# Board configuration - adjust based on your hardware
esp8266:
  board: esp01_1m
  framework:
    version: recommended

# For ESP32, uncomment below and comment out esp8266 section
# esp32:
#   board: esp32dev
#   framework:
#     type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    hisense_ac: DEBUG
    climate: DEBUG
    sensor: DEBUG
    uart: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

# Captive portal
captive_portal:

# Web server for debugging
web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# UART configuration
uart:
  id: ac_uart
  tx_pin: GPIO1  # Adjust based on your board
  rx_pin: GPIO3  # Adjust based on your board
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\n"
    sequence:
      - lambda: |-
          UARTDebug::log_string(direction, bytes);

# External component configuration
external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

# Climate component with ALL new features
climate:
  - platform: hisense_ac
    id: ac_climate
    name: "${friendly_name}"
    uart_id: ac_uart
    
    # NEW: Flow control pin for RS485 (optional)
    # Uncomment and adjust pin if using RS485
    # flow_control_pin: GPIO4
    
    # NEW: Display control (default is true)
    display_enabled: true
    
    # Sensors (optional but recommended)
    compressor_frequency_sensor:
      name: "${friendly_name} Compressor"
      id: compressor_freq
    outdoor_temperature_sensor:
      name: "${friendly_name} Outdoor Temp"
      id: outdoor_temp
    pipe_temperature_sensor:
      name: "${friendly_name} Pipe Temp"
      id: pipe_temp

# Additional diagnostic sensors
sensor:
  # WiFi signal sensor
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    
  # Uptime sensor
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    
  # Free heap to monitor memory
  - platform: template
    name: "${friendly_name} Free Heap"
    lambda: |-
      return ESP.getFreeHeap();
    unit_of_measurement: "bytes"
    update_interval: 30s
    icon: "mdi:memory"

# Status LED
light:
  - platform: status_led
    name: "${friendly_name} Status LED"
    pin:
      number: GPIO2
      inverted: true

# Binary sensor for connection status
binary_sensor:
  - platform: status
    name: "${friendly_name} Connection Status"

# Text sensors for diagnostics
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} Connected SSID"
  
  - platform: version
    name: "${friendly_name} ESPHome Version"

# Control buttons
button:
  - platform: restart
    name: "${friendly_name} Restart"
    
  - platform: template
    name: "${friendly_name} Query Status"
    on_press:
      - logger.log: "Manual status query triggered"
      
  - platform: template
    name: "${friendly_name} Toggle Display"
    on_press:
      - lambda: |-
          auto *climate_component = id(ac_climate);
          bool current = climate_component->get_display_enabled();
          climate_component->set_display_enabled(!current);
          ESP_LOGD("button", "Display toggled to: %s", !current ? "ON" : "OFF");

# Switches for additional control
switch:
  - platform: template
    name: "${friendly_name} Display"
    id: display_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          id(ac_climate)->set_display_enabled(true);
    on_turn_off:
      - lambda: |-
          id(ac_climate)->set_display_enabled(false);

# Time component for scheduling
time:
  - platform: homeassistant
    id: homeassistant_time

# Example automation using new features
automation:
  # Turn off display at night
  - alias: "Turn off display at night"
    trigger:
      - platform: time
        at: "22:00:00"
    action:
      - switch.turn_off: display_switch
      - logger.log: "Display turned off for night time"
  
  # Turn on display in the morning
  - alias: "Turn on display in the morning"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - switch.turn_on: display_switch
      - logger.log: "Display turned on for day time"