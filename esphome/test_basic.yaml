# Basic test configuration for Hisense AC component
# This minimal config helps verify the component loads properly

substitutions:
  device_name: hisense-ac-test
  friendly_name: "Test AC"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  
  # Enable verbose logging to see what's happening
  on_boot:
    priority: -100
    then:
      - logger.log: "Device booted successfully"
      - delay: 5s
      - logger.log: "Checking component status..."

# Use ESP8266 for ESP-01
esp8266:
  board: esp01_1m
  # Optimize for limited memory
  framework:
    version: recommended

# Enable logging with debug level
logger:
  level: DEBUG
  # Show logs for our component
  logs:
    hisense_ac: DEBUG
    climate: DEBUG
    sensor: DEBUG
    uart: DEBUG
    component: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "your_encryption_key_here"
  # Add service to test component
  services:
    - service: test_query_status
      then:
        - logger.log: "Testing status query..."

# Enable OTA updates
ota:
  - platform: esphome
    password: "your_ota_password"

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name}-fallback"
    password: "fallback123"

# Captive portal for easy setup
captive_portal:

# Web server for debugging
web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

# UART configuration for ESP-01
# TX: GPIO1, RX: GPIO3 are the standard UART pins
uart:
  id: ac_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\n"
    sequence:
      - lambda: |-
          UARTDebug::log_string(direction, bytes);
          ESP_LOGD("uart_debug", "UART %s: %s", 
                   direction == UART_DIRECTION_RX ? "RX" : "TX",
                   format_hex_pretty(bytes).c_str());

# External component configuration
external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

# Climate component - minimal configuration
climate:
  - platform: hisense_ac
    id: ac_climate
    name: "${friendly_name}"
    uart_id: ac_uart
    
    # Optional: Add sensors to verify data is being received
    compressor_frequency_sensor:
      name: "${friendly_name} Compressor"
      id: compressor_freq
    outdoor_temperature_sensor:
      name: "${friendly_name} Outdoor Temp"
      id: outdoor_temp
    pipe_temperature_sensor:
      name: "${friendly_name} Pipe Temp"
      id: pipe_temp

# Fallback entities to verify device is connected
sensor:
  # WiFi signal sensor
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    
  # Uptime sensor
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    
  # Free heap to monitor memory
  - platform: template
    name: "${friendly_name} Free Heap"
    lambda: |-
      return ESP.getFreeHeap();
    unit_of_measurement: "bytes"
    update_interval: 30s
    icon: "mdi:memory"

# Status LED using built-in LED (if available)
light:
  - platform: status_led
    name: "${friendly_name} Status LED"
    pin:
      number: GPIO2
      inverted: true

# Binary sensor for connection status
binary_sensor:
  - platform: status
    name: "${friendly_name} Connection Status"

# Text sensor for diagnostics
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} Connected SSID"
  
  - platform: version
    name: "${friendly_name} ESPHome Version"
    
  - platform: template
    name: "${friendly_name} Debug Info"
    lambda: |-
      return "Heap: " + to_string(ESP.getFreeHeap()) + 
             " / Stack: " + to_string(ESP.getFreeContStack());
    update_interval: 30s

# Button to restart the device
button:
  - platform: restart
    name: "${friendly_name} Restart"
    
  - platform: template
    name: "${friendly_name} Query AC Status"
    on_press:
      - logger.log: "Manual status query triggered"

# Time component for scheduling
time:
  - platform: homeassistant
    id: homeassistant_time