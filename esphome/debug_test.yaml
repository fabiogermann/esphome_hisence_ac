# Debug configuration for troubleshooting checksum issues
# This config allows reading despite checksum errors

substitutions:
  device_name: hisense-ac-debug
  friendly_name: "Debug AC"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  
  on_boot:
    priority: -100
    then:
      - logger.log: "Device booted - Debug mode active"
      - delay: 2s
      - logger.log: "Starting AC communication..."

# Use ESP8266 for ESP-01
esp8266:
  board: esp01_1m
  framework:
    version: recommended

# Enable verbose logging
logger:
  level: VERBOSE
  logs:
    hisense_ac: VERBOSE
    climate: DEBUG
    sensor: DEBUG
    uart: VERBOSE
    uart_debug: VERBOSE
    component: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

# Captive portal for easy setup
captive_portal:

# Web server for debugging
web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# UART configuration with extensive debugging
uart:
  id: ac_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\n"
    sequence:
      - lambda: |-
          // Log raw UART data in hex format
          std::string hex_str;
          for (size_t i = 0; i < bytes.size(); i++) {
            char buf[4];
            sprintf(buf, "%02X ", bytes[i]);
            hex_str += buf;
            if ((i + 1) % 16 == 0) {
              ESP_LOGV("uart_raw", "%s: %s", 
                       direction == UART_DIRECTION_RX ? "RX" : "TX",
                       hex_str.c_str());
              hex_str.clear();
            }
          }
          if (!hex_str.empty()) {
            ESP_LOGV("uart_raw", "%s: %s", 
                     direction == UART_DIRECTION_RX ? "RX" : "TX",
                     hex_str.c_str());
          }
          
          // Check for frame markers
          if (bytes.size() >= 4) {
            if (bytes[0] == 0xF4 && bytes[1] == 0xF5) {
              ESP_LOGD("uart_frame", "Frame header detected");
            }
            size_t len = bytes.size();
            if (bytes[len-2] == 0xF4 && bytes[len-1] == 0xFB) {
              ESP_LOGD("uart_frame", "Frame footer detected, length: %d", len);
              
              // Calculate different checksums for analysis
              if (len > 6) {
                uint16_t sum = 0;
                uint16_t xor_sum = 0;
                uint16_t crc = 0xFFFF;
                
                for (size_t i = 2; i < len - 4; i++) {
                  sum += bytes[i];
                  xor_sum ^= bytes[i];
                  // Simple CRC
                  crc ^= bytes[i];
                  for (int j = 0; j < 8; j++) {
                    if (crc & 0x0001) {
                      crc = (crc >> 1) ^ 0xA001;
                    } else {
                      crc = crc >> 1;
                    }
                  }
                }
                
                uint16_t recv_checksum = (bytes[len-4] << 8) | bytes[len-3];
                ESP_LOGD("checksum_debug", "Received: 0x%04X", recv_checksum);
                ESP_LOGD("checksum_debug", "Sum: 0x%04X", sum);
                ESP_LOGD("checksum_debug", "XOR: 0x%04X", xor_sum);
                ESP_LOGD("checksum_debug", "CRC: 0x%04X", crc);
                ESP_LOGD("checksum_debug", "Sum&0xFF: 0x%04X", sum & 0xFF);
                ESP_LOGD("checksum_debug", "Sum>>8: 0x%04X", sum >> 8);
              }
            }
          }

# External component configuration
external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

# Climate component with all sensors
climate:
  - platform: hisense_ac
    id: ac_climate
    name: "${friendly_name}"
    uart_id: ac_uart
    
    # Add all sensors for debugging
    compressor_frequency_sensor:
      name: "${friendly_name} Compressor"
      id: compressor_freq
      filters:
        - lambda: |-
            ESP_LOGD("sensor", "Compressor frequency: %.0f Hz", x);
            return x;
    
    outdoor_temperature_sensor:
      name: "${friendly_name} Outdoor Temp"
      id: outdoor_temp
      filters:
        - lambda: |-
            ESP_LOGD("sensor", "Outdoor temperature: %.1f°C", x);
            return x;
    
    pipe_temperature_sensor:
      name: "${friendly_name} Pipe Temp"
      id: pipe_temp
      filters:
        - lambda: |-
            ESP_LOGD("sensor", "Pipe temperature: %.1f°C", x);
            return x;

# Additional debug sensors
sensor:
  # WiFi signal sensor
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    
  # Uptime sensor
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    
  # Free heap to monitor memory
  - platform: template
    name: "${friendly_name} Free Heap"
    lambda: |-
      return ESP.getFreeHeap();
    unit_of_measurement: "bytes"
    update_interval: 10s
    icon: "mdi:memory"

# Status LED using built-in LED
light:
  - platform: status_led
    name: "${friendly_name} Status LED"
    pin:
      number: GPIO2
      inverted: true

# Binary sensor for connection status
binary_sensor:
  - platform: status
    name: "${friendly_name} Connection Status"

# Text sensors for diagnostics
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} Connected SSID"
  
  - platform: version
    name: "${friendly_name} ESPHome Version"
    
  - platform: template
    name: "${friendly_name} Last Frame"
    id: last_frame_info
    icon: "mdi:information"

# Buttons for testing
button:
  - platform: restart
    name: "${friendly_name} Restart"
    
  - platform: template
    name: "${friendly_name} Query Status"
    on_press:
      - logger.log: "Manual status query triggered"
      - lambda: |-
          auto *climate_component = id(ac_climate);
          ESP_LOGD("button", "Sending query command...");
      
  - platform: template
    name: "${friendly_name} Test Power On"
    on_press:
      - logger.log: "Testing power on command"
      - climate.control:
          id: ac_climate
          mode: COOL
          
  - platform: template
    name: "${friendly_name} Test Power Off"
    on_press:
      - logger.log: "Testing power off command"
      - climate.control:
          id: ac_climate
          mode: "OFF"

# Time component for scheduling
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      # Query status every 30 seconds
      - seconds: /30
        then:
          - logger.log: 
              level: VERBOSE
              format: "Periodic status query at %02d:%02d:%02d"
              args: ['id(homeassistant_time).now().hour', 'id(homeassistant_time).now().minute', 'id(homeassistant_time).now().second']