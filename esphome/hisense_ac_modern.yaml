# Modern Hisense AC ESPHome Configuration
# Compatible with ESPHome 2024.12.x
# Combines best features from multiple implementations

# External Components
external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

# Project Information
esphome:
  name: hisense-ac
  friendly_name: "Hisense AC"
  comment: "Modern Hisense AC control via UART"
  project:
    name: "hisense.ac_controller"
    version: "2.0.0"
  
  on_boot:
    priority: -100
    then:
      - logger.log: "Hisense AC Controller initialized"
      - lambda: |-
          id(ac_power_state).publish_state("OFF");

# Platform Configuration (ESP32 or ESP8266)
# Uncomment the appropriate section for your board

# ESP32 Configuration
esp32:
  board: esp32dev
  framework:
    type: arduino
    version: recommended

# ESP8266 Configuration (comment out ESP32 section above and uncomment this)
# esp8266:
#   board: esp01_1m
#   framework:
#     version: recommended

# Enable logging with proper levels
logger:
  level: INFO
  baud_rate: 0  # Disable UART logging to avoid conflicts
  logs:
    uart: DEBUG
    sensor: INFO
    climate: INFO

# Home Assistant API with encryption
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

# OTA Updates with password protection
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Optional: Static IP configuration
  # manual_ip:
  #   static_ip: 192.168.1.100
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  
  # Enable fallback hotspot
  ap:
    ssid: "Hisense-AC-Fallback"
    password: !secret ap_password

captive_portal:

# Web Server for local control
web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# UART Configuration
uart:
  id: ac_uart
  # ESP32 pins
  tx_pin: GPIO17
  rx_pin: GPIO16
  # ESP8266 pins (uncomment if using ESP8266)
  # tx_pin: GPIO1
  # rx_pin: GPIO3
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_buffer_size: 256

# Global Variables for state management
globals:
  # Power and mode states
  - id: current_power
    type: bool
    initial_value: "false"
    restore_value: true
  
  - id: current_ac_mode
    type: std::string
    initial_value: '"cool"'
    restore_value: true
  
  - id: current_set_temp
    type: uint8_t
    initial_value: "24"
    restore_value: true
  
  - id: current_room_temp
    type: float
    initial_value: "20.0"
    restore_value: false
  
  # Fan and swing states
  - id: current_fan_mode
    type: std::string
    initial_value: '"auto"'
    restore_value: true
  
  - id: current_swing_mode
    type: std::string
    initial_value: '"off"'
    restore_value: true
  
  - id: current_swing_ud
    type: bool
    initial_value: "false"
    restore_value: true
  
  - id: current_swing_lr
    type: bool
    initial_value: "false"
    restore_value: true
  
  # Special modes
  - id: current_turbo
    type: bool
    initial_value: "false"
    restore_value: false
  
  - id: current_eco
    type: bool
    initial_value: "false"
    restore_value: true
  
  - id: current_quiet
    type: bool
    initial_value: "false"
    restore_value: true
  
  - id: current_sleep
    type: std::string
    initial_value: '"off"'
    restore_value: true
  
  - id: current_led
    type: bool
    initial_value: "true"
    restore_value: true
  
  # Communication control
  - id: lock_update
    type: bool
    initial_value: "false"
    restore_value: false
  
  - id: write_pending
    type: bool
    initial_value: "false"
    restore_value: false
  
  # Command buffer
  - id: command_buffer
    type: std::vector<uint8_t>
    initial_value: '{0xF4, 0xF5, 0x00, 0x40, 0x29, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x65, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xF4, 0xFB}'
    restore_value: false

# Climate Component (External Component)
climate:
  - platform: hisense_ac
    name: "Hisense AC"
    id: ac_unit
    uart_id: ac_uart
    compressor_frequency_sensor:
      name: "Compressor Frequency"
      id: compressor_frequency
    outdoor_temperature_sensor:
      name: "Outdoor Temperature"
      id: outdoor_temperature
    pipe_temperature_sensor:
      name: "Pipe Temperature"
      id: pipe_temperature

# Text Sensors
text_sensor:
  - platform: template
    name: "AC Power State"
    id: ac_power_state
    icon: "mdi:power"
  
  - platform: template
    name: "AC Current Mode"
    id: ac_current_mode
    icon: "mdi:air-conditioner"
  
  - platform: template
    name: "HVAC Action"
    id: hvac_action
    icon: "mdi:hvac"

# Binary Sensors
binary_sensor:
  - platform: template
    name: "Compressor Running"
    id: compressor_running
    device_class: running
    lambda: |-
      return id(compressor_frequency).state > 0;

# Sensors
sensor:
  # Temperature sensors
  - platform: template
    name: "Set Temperature"
    id: temp_set
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:thermometer"
  
  - platform: template
    name: "Current Temperature"
    id: temp_current
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2
  
  - platform: template
    name: "Indoor Pipe Temperature"
    id: temp_pipe
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:pipe-leak"
  
  - platform: template
    name: "Outdoor Temperature"
    id: temp_outdoor
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:thermometer"
  
  - platform: template
    name: "Outdoor Condenser Temperature"
    id: temp_condenser
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:thermometer"
  
  - platform: template
    name: "Compressor Exhaust Temperature"
    id: temp_exhaust
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:thermometer-alert"
  
  # Compressor sensors
  - platform: template
    name: "Compressor Frequency"
    id: compressor_frequency
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:sine-wave"
  
  - platform: template
    name: "Compressor Frequency Setting"
    id: compressor_frequency_setting
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0
    internal: true
  
  # Humidity sensors
  - platform: template
    name: "Indoor Humidity"
    id: indoor_humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:water-percent"
  
  # Optional: External DHT22 sensor for accurate room temperature
  # - platform: dht
  #   pin: GPIO13  # Adjust pin as needed
  #   model: DHT22
  #   temperature:
  #     name: "Room Temperature (DHT22)"
  #     id: dht_temperature
  #   humidity:
  #     name: "Room Humidity (DHT22)"
  #     id: dht_humidity
  #   update_interval: 60s

# Switches
switch:
  - platform: template
    name: "AC Power"
    id: switch_power
    icon: "mdi:power"
    optimistic: false
    lambda: |-
      return id(current_power);
    turn_on_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_power) = true;
    turn_off_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_power) = false;
  
  - platform: template
    name: "Turbo Mode"
    id: switch_turbo
    icon: "mdi:rocket-launch"
    optimistic: false
    lambda: |-
      return id(current_turbo);
    turn_on_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_turbo) = true;
          id(current_eco) = false;
          id(current_quiet) = false;
    turn_off_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_turbo) = false;
  
  - platform: template
    name: "ECO Mode"
    id: switch_eco
    icon: "mdi:leaf"
    optimistic: false
    lambda: |-
      return id(current_eco);
    turn_on_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_eco) = true;
          id(current_turbo) = false;
    turn_off_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_eco) = false;
  
  - platform: template
    name: "Quiet Mode"
    id: switch_quiet
    icon: "mdi:volume-off"
    optimistic: false
    lambda: |-
      return id(current_quiet);
    turn_on_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_quiet) = true;
          id(current_turbo) = false;
    turn_off_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_quiet) = false;
  
  - platform: template
    name: "Display LED"
    id: switch_led
    icon: "mdi:led-on"
    optimistic: false
    lambda: |-
      return id(current_led);
    turn_on_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_led) = true;
    turn_off_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_led) = false;
  
  - platform: template
    name: "Swing Up-Down"
    id: switch_swing_ud
    icon: "mdi:arrow-up-down"
    optimistic: false
    lambda: |-
      return id(current_swing_ud);
    turn_on_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_swing_ud) = true;
    turn_off_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_swing_ud) = false;
  
  - platform: template
    name: "Swing Left-Right"
    id: switch_swing_lr
    icon: "mdi:arrow-left-right"
    optimistic: false
    lambda: |-
      return id(current_swing_lr);
    turn_on_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_swing_lr) = true;
    turn_off_action:
      - lambda: |-
          id(write_pending) = true;
          id(lock_update) = true;
          id(current_swing_lr) = false;
  
  - platform: restart
    name: "Restart ESP"
    icon: "mdi:restart"

# Select Components
select:
  - platform: template
    name: "AC Mode"
    id: select_ac_mode
    icon: "mdi:air-conditioner"
    optimistic: false
    options:
      - "off"
      - "cool"
      - "heat"
      - "dry"
      - "fan_only"
      - "auto"
    lambda: |-
      return id(current_ac_mode);
    set_action:
      - lambda: |-
          if (x != id(current_ac_mode)) {
            id(write_pending) = true;
            id(lock_update) = true;
            id(current_ac_mode) = x;
          }
  
  - platform: template
    name: "Fan Mode"
    id: select_fan_mode
    icon: "mdi:fan"
    optimistic: false
    options:
      - "auto"
      - "quiet"
      - "low"
      - "medium"
      - "high"
      - "turbo"
    lambda: |-
      return id(current_fan_mode);
    set_action:
      - lambda: |-
          if (x != id(current_fan_mode)) {
            id(write_pending) = true;
            id(lock_update) = true;
            id(current_fan_mode) = x;
          }
  
  - platform: template
    name: "Sleep Mode"
    id: select_sleep_mode
    icon: "mdi:sleep"
    optimistic: false
    options:
      - "off"
      - "sleep_1"
      - "sleep_2"
      - "sleep_3"
      - "sleep_4"
    lambda: |-
      return id(current_sleep);
    set_action:
      - lambda: |-
          if (x != id(current_sleep)) {
            id(write_pending) = true;
            id(lock_update) = true;
            id(current_sleep) = x;
          }

# Number Components
number:
  - platform: template
    name: "Target Temperature"
    id: number_target_temp
    icon: "mdi:thermometer"
    optimistic: false
    min_value: 16
    max_value: 32
    step: 1
    unit_of_measurement: "°C"
    mode: slider
    lambda: |-
      return id(current_set_temp);
    set_action:
      - lambda: |-
          uint8_t temp = (uint8_t)x;
          if (temp != id(current_set_temp)) {
            id(write_pending) = true;
            id(lock_update) = true;
            id(current_set_temp) = temp;
          }

# Button Components
button:
  - platform: template
    name: "Query Status"
    icon: "mdi:refresh"
    on_press:
      - uart.write:
          id: ac_uart
          data: [0xF4, 0xF5, 0x00, 0x40, 0x0C, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x66, 0x00, 0x00, 0x00, 0x01, 0xB3, 0xF4, 0xFB]

# Script for handling command writes
script:
  - id: write_changes_script
    mode: restart
    then:
      - delay: 1500ms
      - lambda: |-
          ESP_LOGD("AC", "Writing changes to AC unit");
          id(write_pending) = false;
          // Command building logic would go here
          // This is simplified - the actual implementation would be in the custom component

# Interval for status updates
interval:
  - interval: 2s
    then:
      - lambda: |-
          if (!id(lock_update) && !id(write_pending)) {
            // Send status query command
            uint8_t query[] = {0xF4, 0xF5, 0x00, 0x40, 0x0C, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x66, 0x00, 0x00, 0x00, 0x01, 0xB3, 0xF4, 0xFB};
            id(ac_uart).write_array(query, sizeof(query));
          } else if (id(write_pending)) {
            id(write_changes_script).execute();
          }