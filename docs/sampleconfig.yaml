# External Components
# In this repo the component lives at the top level (hisense_ac/), so the
# local path points one directory up from this file. When you copy this
# config into your own ESPHome setup, use the git source instead:
#   external_components:
#     - source: github://fabiogermann/esphome_hisence_ac
#       components: [hisense_ac]
external_components:
  - source:
      type: local
      path: ..
    components: [hisense_ac]

esphome:
  name: acremote01
  friendly_name: acremote01
  
  on_boot:
    priority: -100
    then:
      - logger.log: "Hisense AC Controller (ESP8266) initialized"

esp8266:
  board: esp01_1m
  framework:
    version: recommended

# Enable logging
logger:
  level: INFO            # DEBUG noticeably slows the loop on ESP8266 and can
                         # cause dropped UART bytes. Bump to DEBUG only when
                         # diagnosing a specific issue.
  baud_rate: 0           # Disable UART logging (GPIO1/3 are used by the AC).
  logs:
    climate.air_conditioner: INFO

# Enable Home Assistant API
api:
  encryption:
    # Replace with your own 32-byte base64 key, e.g.
    # python3 -c 'import base64,os; print(base64.b64encode(os.urandom(32)).decode())'
    key: "GyDwPegwrAAjlW7PH9q/+UTbRA1cG14BShakKf+mtCk="

ota:
  - platform: esphome
    password: "some password"

wifi:
  use_address: 10.1.143.107
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Acremote01 Fallback Hotspot"
    password: "somepassword"

  # Power save mode for ESP8266
  power_save_mode: LIGHT

captive_portal:
    
####### CUSTOM PART FOR AC #######
uart:
  id: ac_uart
  tx_pin: GPIO1  # TX pin (limited options on ESP8266)
  rx_pin: GPIO3  # RX pin (limited options on ESP8266)
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE
  # The hardware FIFO on ESP8266 is small (~128 B). A 9600 baud line delivers
  # ~960 B/s, so an 82-byte status response takes ~85 ms. Loop iterations
  # under load can easily exceed that, dropping bytes if the SW buffer is
  # tight. 512 B leaves margin without hurting RAM.
  rx_buffer_size: 512

  # NOTE: The uart.debug block is intentionally disabled. It logs every
  # inbound frame synchronously via ESP_LOGD which costs several ms per
  # frame on ESP8266 and is the prime cause of dropped/short reads on the
  # AC's tight inter-frame timing. Re-enable only for one-shot debugging.
  #
  # debug:
  #   direction: BOTH
  #   dummy_receiver: true
  #   after:
  #     delimiter: [0xF4, 0xFB]
  #   sequence:
  #     - lambda: |-
  #         UARTDebug::log_hex(direction, bytes, ' ');

climate:
  - platform: hisense_ac
    name: Hisense
    uart_id: ac_uart
    id: hisense_ac
    # Set to true only if your unit's wire-protocol uses Fahrenheit (upstream
    # PR #11, US-market AEH-W4A1). Most units (EU/global) speak Celsius.
    # use_fahrenheit: false

sensor:
  - platform: hisense_ac
    hisense_id: hisense_ac
    indoor_coil_temperature:
      name: Indoor Coil Temperature
  - platform: hisense_ac
    hisense_id: hisense_ac
    outdoor_coil_temperature:
      name: Outdoor Coil Temperature
  - platform: hisense_ac
    hisense_id: hisense_ac
    indoor_temperature:
      name: Indoor Temperature
  - platform: hisense_ac
    hisense_id: hisense_ac
    outdoor_temperature:
      name: Outdoor Temperature

switch:
  - platform: hisense_ac
    hisense_id: hisense_ac
    hisens_display:
      name: Hisens Display Enable
