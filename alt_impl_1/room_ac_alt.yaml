  - id: bytearray
    type: std::vector<uint8_t>
    restore_value: no
    initial_value: '{0xF4, 0xF5, 0x00, 0x40, 0x29, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x65, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xF4, 0xFB}'

  - id: bytearray_init
    type: std::vector<uint8_t>
    restore_value: no
    initial_value: '{0xF4, 0xF5, 0x00, 0x40, 0x29, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x65, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xF4, 0xFB}'

  - id: bytearray_resp
    type: std::vector<uint8_t>
    restore_value: no
    initial_value: '{0xF4, 0xF5, 0x01, 0x40, 0x49, 0x01, 0x00, 0xFE, 0x01, 0x01, 0x01, 0x01, 0x00, 0x66, 0x00, 0x01, 0x0A, 0x00, 0x08, 0x17, 0x1B, 0x19, 0x80, 0x80, 0x00, 0x01, 0x01, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x80, 0x05, 0x00, 0x00, 0x00, 0x00, 0x00, 0x1C, 0x4C, 0x20, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04, 0x62, 0xF4, 0xFB}'

  - id: debugarr
    type: bool
    restore_value: no
    initial_value: 'false'


uart:
  id: mod_bus
  tx_pin: 17
  rx_pin: 5
  stop_bits: 1
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      delimiter: [0xF4, 0xFB]
    sequence:
      - lambda: |-

          static int status_crc;
          static std::string decode_acmode_codes[8]{ "fan_only", "heat", "cool", "dry", "auto","auto","auto","auto" }; // auto modes could be auto_dry, auto_heat, auto_cold and auto? no reference in docs
          static std::string decode_wind_codes[19]{ "off", "auto","auto","auto","auto","auto","auto","auto","auto","auto", "lowest", "auto","low","auto","medium","auto","high","auto","highest" };
          static std::string decode_sleep_codes[5]{ "off","sleep_1","sleep_2","sleep_3","sleep_4"};

          //UARTDebug::log_hex(direction, bytes, ' ');

          //ESP_LOGD("UART", "Byte Array Size: %d", bytes.size() );

          // PreCheck resived data

          if((bytes[0]==0xF4) && (bytes[1]==0xF5) && (bytes.size() > 20)) {
              
            //UARTDebug::log_hex(direction, bytes, ' ');

            if(bytes[2] == 0) {

              ESP_LOGV("UART", "Request Data Array");

              if ((bytes[13] == 101) && (bytes.size() > 21)) {
                ESP_LOGI("UART", "Command Sent");
                //UARTDebug::log_hex(direction, bytes, ' ');
              }

            } else if (bytes[2] == 1) {

              ESP_LOGV("UART", "Response Data Array");
              //parsing status message from AC (102 and 101)

              bool status_check = false;
  
              if (bytes[13] == 101) {
                ESP_LOGV("UART", "CMD Response [101] Data Received");
                id(lock_update) = false;
                status_check = true;
                id(bytearray) = id(bytearray_init);

              } else if (bytes[13] == 102) {
                ESP_LOGV("UART", "Status Check [102] Data Received");

                // check if something changed using crc

                int crc = 0;
                int arrlen = bytes.size();

                for (int i = 2; i < arrlen-4; i++) {
                  crc = crc + bytes[i];
                }

                if (crc == status_crc) {
                  ESP_LOGV("UART", "CRC Not changed");
                } else if (crc != status_crc) {
                  status_check = true;
                  status_crc = crc;
                } else {
                  ESP_LOGW("UART", "CRC Check Error");
                }
              } else {
                ESP_LOGW("UART", "Incorrect Data Array (Bytes[13]<>102(101))");
              }

              if (status_check == true) {
                  //ESP_LOGI("UART", "%s Data Received", (bytes[13] == 102) ? "Status Check [102]" : "CMD Response [101]");


                  //UARTDebug::log_hex(direction, bytes, ' ');

                  uint8_t mask = 0b00000000;
                  bool val = mask;

                  //-------------- Current Power Status global -------------------
                  mask = 0b00001000;
                  val = ((bytes[18] & mask)!=0);
                  id(current_power) = val;
                  if(id(current_power)!= (id(switch_power).state) ) {
                    ESP_LOGI("UART","POWER. Mask: %x, Response [18] HEX: %x, Global: %s",  mask, (bytes[18] & mask) , id(current_power) ? "True" : "False");
                    id(switch_power).publish_state(id(current_power));
                    id(bytearray_resp)[18] = bytes[18];
                  }

                  //-------------- Current WIND MODE global ---------------
                  id(current_wind) = (decode_wind_codes[ (bytes[16]) ]);
                  if (id(current_wind) != (id(select_wind_mode).state)) {
                    ESP_LOGI("UART","WIND MODE. Response [16] HEX: %x, Global: %s",  (bytes[16]) , id(current_wind).c_str() );
                    id(select_wind_mode).publish_state(id(current_wind));
                    id(bytearray_resp)[16] = bytes[16];
                  }

                  //------------- Current AC SLEEP global -----------------
                  id(current_sleep) = (decode_sleep_codes[ (bytes[17]) ]);
                  char str2[] = "sleep_2";
                  int result;
                  result = strcmp(id(current_sleep).c_str(), str2);
                  if( result == 0 ) {
                    id(current_sleep_mode) = true;
                  } else {
                    id(current_sleep_mode) = false;
                  }
                  if ( id(current_sleep_mode) != (id(switch_sleep).state) ) {
                    ESP_LOGI("UART","SPEEP MODE. Response [17] HEX: %x, Global: %s",  (bytes[17]) , id(current_sleep).c_str() );
                    id(switch_sleep).publish_state(id(current_sleep_mode));
                    id(bytearray_resp)[17] = bytes[17];
                  }

                  // ------------ Current AC MODE global --------------
                  id(current_ac_mode) = (decode_acmode_codes[ (bytes[18] >> 4)  ]);
                  if ( id(current_ac_mode) != (id(select_ac_mode).state) ) {
                    ESP_LOGI("UART","AC MODE. Response [18] HEX: %x, Global: %s",  (bytes[18] >> 4) , id(current_ac_mode).c_str() );
                    id(select_ac_mode).publish_state(id(current_ac_mode));
                    id(bytearray_resp)[18] = bytes[18];
                  }

                  // ---------------  TEMPERATURE SET  ---------------   
                  id(current_set_temp) = bytes[19];
                  if (id(current_set_temp) != (id(temp_set).state) ) {
                    ESP_LOGI("UART","TEMPERATURE Set. Response [19] HEX: %x, Global: %d",  (bytes[19]) , id(current_set_temp) );
                    id(temp_set).publish_state(id(current_set_temp));
                    id(bytearray_resp)[19] = bytes[19];
                  }

                  // ---------------  INDOOR TEMPERATURE  ---------------  
                  id(temp_current).publish_state( bytes[20]);
                  id(bytearray_resp)[20] = bytes[20];

                  // ---------------  INDOOR PIPE TEMP  ---------------  
                  id(temp_pipe_current).publish_state( bytes[21]);
                  id(bytearray_resp)[21] = bytes[21];

                  // ---------------  TEMP COMPENSATION SET  ---------------   
                  id(current_temp_comp_set) = bytes[26] >> 4;
                  if (id(current_temp_comp_set) > 7 ) {
                    id(current_temp_comp_set) = (8 - id(current_temp_comp_set));
                  }
                  if (id(current_temp_comp_set) != (id(temp_comp_set).state) ) {
                    ESP_LOGI("UART","TEMPERATURE COMPENSATION Set. Response [26] HEX: %x, Global: %d",  (bytes[26]) , id(current_temp_comp_set) );
                    id(temp_comp_set).publish_state(id(current_temp_comp_set));
                    id(bytearray_resp)[26] = bytes[26];
                  }
                  
                  // ---------------  COMPRESSOR FREQUENCY  ---------------
                  id(compressor_frequency).publish_state( bytes[41]);
                  id(bytearray_resp)[41] = bytes[41];

                  // ---------------  COMPRESSOR FREQUENCY SET  ---------------
                  id(compressor_frequency_setting).publish_state( bytes[42]);
                  id(bytearray_resp)[42] = bytes[42];

                  // ---------------  OUTDOOR TEMPERATURE  ---------------
                  id(outdoor_temperature).publish_state( bytes[44]);
                  id(bytearray_resp)[44] = bytes[44];

                  // ---------------  OUTDOOR CONDENSER TEMPERATURE  ---------------
                  id(outdoor_condenser_temperature).publish_state( bytes[45]);
                  id(bytearray_resp)[45] = bytes[45];

                  // ---------------  EXHAUST COMPRESSOR TEMPERATURE  ---------------
                  id(compressor_exhaust_temperature).publish_state( bytes[46]);
                  id(bytearray_resp)[46] = bytes[46];

                  // ---------------  QUIET Mode  ---------------   
                  mask = 0b00000100;
                  val = ( (bytes[36] & mask)!=0 );
                  id(current_quiet) = val;
                  if(id(current_quiet)!= (id(switch_quiet).state) ) {
                    ESP_LOGI("UART","QUIET. Mask: %x, Response [36] HEX: %x, Global: %s",  mask, (bytes[36] & mask) , id(current_quiet) ? "True" : "False");
                      id(switch_quiet).publish_state(id(current_quiet));
                      id(bytearray_resp)[36] = bytes[36];
                  }

                  // ---------------  ECO mode  ---------------
                  mask = 0b00000100;
                  val = ( (bytes[35] & mask)!=0 );
                  id(current_eco) = val;
                  if(id(current_eco)!= (id(switch_eco).state) ) {
                    ESP_LOGI("UART","ECO. Mask: %x, Response [35] HEX: %x, Global: %s",  mask, (bytes[35] & mask) , id(current_eco) ? "True" : "False");
                      id(switch_eco).publish_state(id(current_eco));
                      id(bytearray_resp)[35] = bytes[35];
                  }

                  // ---------------  SUPER mode  ---------------
                  mask = 0b00000010;
                  val = ( (bytes[35] & mask)!=0 );
                  id(current_super) = val;
                  if(id(current_super)!= (id(switch_super).state) ) {
                    ESP_LOGI("UART","SUPER. Mask: %x, Response [35] HEX: %x, Global: %s",  mask, (bytes[35] & mask) , id(current_super) ? "True" : "False");
                      id(switch_super).publish_state(id(current_super));
                      id(bytearray_resp)[35] = bytes[35];
                  }

                  // ---------------  LED  ---------------
                  mask = 0b10000000;
                  val = ( (bytes[37] & mask)!=0 );
                  id(current_led) = val;
                  if(id(current_led)!= (id(switch_led).state) ) {
                    ESP_LOGI("UART","LED. Mask: %x, Response [37] HEX: %x, Global: %s",  mask, (bytes[37] & mask) , id(current_led) ? "True" : "False");
                      id(switch_led).publish_state(id(current_led));
                      id(bytearray_resp)[37] = bytes[37];
                  }

                  // ---------------  Swing Up-Down  ---------------
                  mask = 0b10000000;
                  val = ( (bytes[35] & mask)!=0 );
                  id(current_swing_ud) = val;
                  if(id(current_swing_ud)!= (id(switch_swing_ud).state) ) {
                    ESP_LOGI("UART","Swing UD. Mask: %x, Response [35] HEX: %x, New value: %s",  mask, (bytes[35] & mask) , val ? "True" : "False");
                    id(switch_swing_ud).publish_state(id(current_swing_ud));
                    id(bytearray_resp)[35] = bytes[35];
                  }

                  // --------------- Swing Left-Right  ---------------
                  mask = 0b01000000;
                  val = ( (bytes[35] & mask)!=0 );
                  id(current_swing_lr) = val;
                  if(id(current_swing_lr)!= (id(switch_swing_lr).state) ) {
                    ESP_LOGI("UART","Swing LR. Mask: %x, Response [35] HEX: %x, New value: %s",  mask, (bytes[35] & mask) , val ? "True" : "False");
                    id(switch_swing_lr).publish_state(id(current_swing_lr));
                    id(bytearray_resp)[35] = bytes[35];
                  }

                  int arrlen = bytes.size();
                  for (int i = 16; i < arrlen-4; i++) {
                    if (bytes[i] != id(bytearray_resp)[i]) {
                      ESP_LOGI("UART", "%s Data Received. New Data at [%d] HEX: %x (%x)", (bytes[13] == 102) ? "Status Check [102]" : "CMD Response [101]", i, (bytes[i]), id(bytearray_resp)[i] );
                      id(bytearray_resp)[i] = bytes[i];
                    }
                  }

              } else {
                ESP_LOGV("UART", "Status check: False");
              }

            } else {
              ESP_LOGW("UART", "Incorrect Data Array");
            }

          } else {
            ESP_LOGW("UART", "Incorrect Data Array");
          }



#Update AC state request
interval:
  - interval: 1800ms
    then:
      - uart.write: !lambda |-
                  if (id(lock_update) == false) {
                    ESP_LOGV("INTERVAL","Status check (lock_update: %s)",  id(lock_update) ? "True" : "False");
                    std::vector<uint8_t> bytes_to_send {0xF4, 0xF5, 0x00, 0x40, 0x0C, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x66, 0x00, 0x00, 0x00, 0x01, 0xb3, 0xf4, 0xFB};
                    return bytes_to_send;
                  } else {
                    if (id(debugarr) == true) {
                        ESP_LOGV("INTERVAL","Sending command data (debugarr: %s)",  id(debugarr) ? "True" : "False");

                        short int csum = 0;
                        int arrlen = id(bytearray).size();
                        for (int i = 2; i < arrlen-4; i++) {
                            csum = csum + id(bytearray)[i];
                        }

                        uint8_t cr1 = (csum & 0x0000ff00)  >> 8; 
                        uint8_t cr2 = (csum & 0x000000ff); 

                        id(bytearray)[46] = cr1; 
                        id(bytearray)[47] = cr2; 

                        return id(bytearray);

                        id(debugarr) = false;

                    } else {
                        ESP_LOGI("INTERVAL","Skipping auto update (lock_update: %s)",  id(lock_update) ? "True" : "False");
                        std::vector<uint8_t> bytes_to_send {};
                        return bytes_to_send; 
                    } 
                  }





