#SLEEP switch
  - platform: template 
    name: "Sleep Mode"
    id: switch_sleep
    optimistic: false
    icon: "mdi:power-sleep"
    lambda: |-
        return id(current_sleep_mode);
    turn_on_action:
      - if:
          condition:
            lambda: 'return  !id(current_sleep_mode);'
          then: 
            lambda: |-  
                        static uint8_t listix_to_sleep_codes[5]{0,1,2,4,8};
                        
                        //protocol asks to shoft 1 bit right and set 1 to left bit when writing
                        uint8_t mode = listix_to_sleep_codes[ 1 ] << 1;

                        mode |= (1ul << 0);
                        id(bytearray)[17] = mode;

                        ESP_LOGI("SELECT","SPEEP MODE set ON. Command [17] set HEX: %x", id(bytearray)[17] );

                        id(debugarr) = true; 
                        id(lock_update) = true;
    turn_off_action:
      - if:
          condition:
            lambda: 'return  id(current_sleep_mode);'
          then: 
            lambda: |-  
                        static uint8_t listix_to_sleep_codes[5]{0,1,2,4,8};
                        
                        //protocol asks to shoft 1 bit right and set 1 to left bit when writing
                        uint8_t mode = listix_to_sleep_codes[ 0 ] << 1;

                        mode |= (1ul << 0);
                        id(bytearray)[17] = mode;

                        ESP_LOGI("SELECT","SPEEP MODE set OFF. Command [17] set HEX: %x", id(bytearray)[17] );

                        id(debugarr) = true; 
                        id(lock_update) = true;


