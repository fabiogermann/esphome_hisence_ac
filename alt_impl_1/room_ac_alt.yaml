              } 


text_sensor:
  - platform: template
    id: hvac_action
    name: "HVAC Action"
    lambda: |-
              auto ac_mode = id(select_ac_mode).active_index();
              float hz = id(compressor_frequency).state;
              float pt = id(temp_pipe_current).state;
              ESP_LOGI("TEXT","HVAC Action Set. AC Mode index %d. Compressor Freq %f. Pipe Temp %f", ac_mode.value(), hz, pt );

              if ( !id(current_power) == true ) {
                return {"off"};
                // if ac_mode is cool
              } else if ( (ac_mode == 2) && (hz > 0) && (pt < 20) ) {
                return {"cooling"};
                // if ac_mode is dry
              } else if ( (ac_mode == 3) && (hz > 0) && (pt < 20) ) {
                return {"drying"};
                // if ac_mode is fan_only
              } else if ( ac_mode == 0 ) {
                return {"fan"};
                // if ac_mode is heat
              } else if ( (ac_mode == 1) && (hz > 0) && (pt > 27) ) {
                return {"heating"};
              } else {
                return {"idle"};
              } 
    icon: "mdi:hvac"



number: 
# AC Temperature (compensation) Set
  - platform: template
    id: temperature_set
    icon: "mdi:home-thermometer"
    name: "Temperature Set"
    optimistic: false
    lambda: |-
        auto ac_mode = id(select_ac_mode).active_index();
        // if ac_mode is heat or cool
        if ( (ac_mode == 1) || (ac_mode == 2) ) {
          return id(temp_set).state;
        // if ac_mode is dry
        } else if ( ac_mode == 3 ) {
          return id(temp_comp_set).state;
        } else {
          return id(temp_current).state;
        }
    min_value: -7
    max_value: 32
    step: 1
    mode: box
    set_action:
      - if:
          condition:
            lambda: 'return  x != id(current_set_temp);'
          then: 
          - lambda: |-   
                        uint8_t c = abs(x);
                        uint8_t tempX = 0;
                        auto ac_mode = id(select_ac_mode).active_index();
                        // if ac_mode is heat or cool
                        if ( (ac_mode == 1) || (ac_mode == 2) ) {
                          tempX = (c << 1); 
                          tempX |= (1ul << 0); 
                          id(bytearray)[19] = tempX;

                          ESP_LOGI("NUMBER","TEMPERATURE set %f. Command [19] set HEX: %x", x, id(bytearray)[19] );
                        // if ac_mode is dry
                        } else if ( ac_mode == 3 ) {
                          tempX = (c << 4); 
                          tempX |= (1ul << 3); 
                          if ( x < 0 ) {
                            tempX |= (1ul << 7);
                          } 
                          id(bytearray)[23] = tempX;

                          ESP_LOGI("NUMBER","TEMPERATURE Compensation set %f. Command [23] set HEX: %x", x, id(bytearray)[23] );
                        }
                        id(debugarr) = true; 
                        id(lock_update) = true;
              

select:  
# AC Modes
  - platform: template
    id: select_ac_mode
    icon: "mdi:air-conditioner"
    name: "Mode"
    optimistic: false
    lambda: |-
        return id(current_ac_mode);
    options:
      - fan_only
      - heat
      - cool
      - dry
    set_action:
      - if:
          condition:
            lambda: 'return  x != id(current_ac_mode);'
          then: 
          - lambda: |-  
                        auto index = id(select_ac_mode).index_of(x);
 
                        //encode ac_mode codes
                        static uint8_t listix_to_mode_codes[4]{0,1,2,3};

                        // protocol asks to shift 1 bit left  and set last bit to 1
                        uint8_t mode = listix_to_mode_codes[ index.value() ] << 1;

                        mode |= (1ul << 0);
                        mode = mode << 4;                
                        id(bytearray)[18] = mode;

                        ESP_LOGI("SELECT","AC Mode set %s (index %d). Command [18] set HEX: %x", x.c_str(), index.value(), id(bytearray)[18] );

                        id(debugarr) = true; 
                        id(lock_update) = true;
        
# AC Wind
  - platform: template  
    id: select_wind_mode
    icon: "mdi:fan"
    name: "Wind mode"
    optimistic: false
    lambda: |-
        return id(current_wind);
    options:
      - "off"
      - auto
      - lowest
      - low
      - medium
      - high
      - highest
    set_action:
      - if:
          condition:
            lambda: 'return  x != id(current_wind);'
          then: 
          - lambda: |-  
                        auto index = id(select_wind_mode).index_of(x);
                        auto ac_mode_index = id(select_ac_mode).active_index();
 
                        if ( (ac_mode_index == 0) && (index == 1) ) {
                          ESP_LOGI("SELECT","WIND MODE can't be set: auto at AC Mode: fan_only" );
                        }
                        static uint8_t listix_to_wind_codes[7]{0,1,10,12,14,16,18};

                        //protocol asks to add +1 to value when writing
                        uint8_t mode = listix_to_wind_codes[ index.value() ] + 1;

                        id(bytearray)[16] = mode;

                        ESP_LOGI("SELECT","WIND MODE set %s (index %d). Command [16] set HEX: %x", x.c_str(), index.value(), id(bytearray)[16] );

                        id(debugarr) = true; 
                        id(lock_update) = true;




switch: 
 # AC Power Switch
  - platform: template 
    name: "Power"
    id: switch_power
    optimistic: false
    icon: "mdi:power"
    lambda: |-
        return id(current_power);
    turn_on_action:
      - if:
          condition:
            lambda: 'return  !id(current_power);'
          then: 
            lambda: |-  
                        auto ac_mode = id(select_ac_mode).active_index();
                        id(bytearray)[18] =  0b00001100;
                        ESP_LOGI("SWITCH","POWER set ON. Command [18] set HEX: %x",  id(bytearray)[18] );
                        //Swing up-down turn_on
                        if ( ac_mode == 0 ) {
                          id(bytearray)[32] = 0b11000000;
                        }
                        id(debugarr) = true; 
                        id(lock_update) = true;
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(current_power);'
          then:
            lambda: |-  
                        id(bytearray)[18] = 0b00000100;
                        ESP_LOGI("SWITCH","POWER set OFF. Command [18] set HEX: %x",  id(bytearray)[18] );
                        id(debugarr) = true; 
                        id(lock_update) = true;


