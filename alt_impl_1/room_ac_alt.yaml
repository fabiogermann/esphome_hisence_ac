
globals:
  - id: current_ac_mode
    type: std::string
    restore_value: no

  - id: current_power
    type: bool
    initial_value: "false"

  - id: current_eco
    type: bool
    initial_value: "false"

  - id: current_led
    type: bool
    initial_value: "false"

  - id: current_quiet
    type: bool
    initial_value: "false"

  - id: current_swing_lr
    type: bool
    initial_value: "false"

  - id: current_swing_ud
    type: bool
    initial_value: "false"

  - id: current_super
    type: bool
    initial_value: "false"

  - id: current_set_temp
    type: int
    restore_value: no

  - id: current_temp_comp_set
    type: int
