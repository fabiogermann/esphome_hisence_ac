# ESP8266-Specific Configuration for Hisense AC
# This file uses the external component structure with memory optimizations

substitutions:
  device_name: hisense-ac-esp8266
  friendly_name: "Hisense AC ESP8266"

# External Components
external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

# Project Information
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Hisense AC control via UART (ESP8266)"
  project:
    name: "hisense.ac_controller"
    version: "2.0.0"
  
  on_boot:
    priority: -100
    then:
      - logger.log: "Hisense AC Controller (ESP8266) initialized"

# ESP8266-specific configuration
esp8266:
  board: esp01_1m  # Or nodemcuv2, d1_mini, etc.
  framework:
    version: recommended
  
  # Restore from flash to save memory
  restore_from_flash: true

# Reduced logging to save memory
logger:
  level: INFO  # Use INFO instead of DEBUG
  baud_rate: 0  # Disable UART logging
  logs:
    uart: WARN  # Reduce UART logging
    sensor: WARN
    climate: INFO

# Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

# OTA Updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true  # Faster connection for ESP8266
  
  # Power save mode for ESP8266
  power_save_mode: LIGHT
  
  ap:
    ssid: "Hisense-AC-8266"
    password: !secret ap_password

captive_portal:

# Simplified web server for ESP8266
web_server:
  port: 80
  # No authentication to save memory
  # auth:
  #   username: !secret web_username
  #   password: !secret web_password

# ESP8266 UART configuration
uart:
  id: ac_uart
  tx_pin: GPIO1  # TX pin (limited options on ESP8266)
  rx_pin: GPIO3  # RX pin (limited options on ESP8266)
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_buffer_size: 256  # Smaller buffer for ESP8266

# Climate Component using external component
climate:
  - platform: hisense_ac
    name: "Hisense AC"
    id: ac_unit
    uart_id: ac_uart
    compressor_frequency_sensor:
      name: "Compressor Frequency"
      id: compressor_frequency
      unit_of_measurement: "Hz"
      device_class: frequency
      state_class: measurement
      accuracy_decimals: 0
    outdoor_temperature_sensor:
      name: "Outdoor Temperature"
      id: outdoor_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 0
    pipe_temperature_sensor:
      name: "Pipe Temperature"
      id: pipe_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 0

# Reduced globals to save memory
globals:
  - id: current_power
    type: bool
    initial_value: "false"
  
  - id: current_set_temp
    type: uint8_t
    initial_value: "24"
  
  - id: lock_update
    type: bool
    initial_value: "false"
  
  - id: write_pending
    type: bool
    initial_value: "false"

# Essential sensors only for ESP8266
sensor:
  # System monitoring (lightweight)
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s  # Less frequent updates
  
  - platform: uptime
    name: "Uptime"
    update_interval: 120s

# Essential switches only
switch:
  - platform: restart
    name: "Restart"
    icon: "mdi:restart"

# Simple status query button
button:
  - platform: template
    name: "Query Status"
    icon: "mdi:refresh"
    on_press:
      - uart.write:
          id: ac_uart
          data: [0xF4, 0xF5, 0x00, 0x40, 0x0C, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x66, 0x00, 0x00, 0x00, 0x01, 0xB3, 0xF4, 0xFB]

# Less frequent updates for ESP8266
interval:
  - interval: 3s  # Slower updates to reduce load
    then:
      - uart.write:
          id: ac_uart
          data: [0xF4, 0xF5, 0x00, 0x40, 0x0C, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x66, 0x00, 0x00, 0x00, 0x01, 0xB3, 0xF4, 0xFB]

# Status LED using built-in LED
status_led:
  pin:
    number: GPIO2  # Built-in LED on most ESP8266 boards
    inverted: true

# Text sensors (minimal)
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
  
  - platform: template
    name: "AC Power State"
    id: ac_power_state
    icon: "mdi:power"

# Binary sensors (minimal)
binary_sensor:
  - platform: status
    name: "Status"
    device_class: connectivity
  
  - platform: template
    name: "Compressor Running"
    id: compressor_running
    device_class: running
    lambda: |-
      return id(compressor_frequency).state > 0;

# Memory optimization notes:
# - Using external component instead of custom platform
# - Removed unnecessary sensors and switches
# - Reduced update frequencies
# - Simplified web server (no auth)
# - Minimal logging
# - Smaller UART buffer
# - No filters on sensors
# - No custom effects on LEDs
# - Optimized for ESP8266 memory constraints