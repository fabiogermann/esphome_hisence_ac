# ESP-01 Specific Configuration for Hisense AC
# Optimized for 1MB flash and limited RAM
# Uses GPIO1 (TX) and GPIO3 (RX) for UART communication

substitutions:
  device_name: hisense-ac-esp01
  friendly_name: "Hisense AC"

# External Components
external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

# Project Information
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Hisense AC control via ESP-01"
  
  # Minimal boot sequence
  on_boot:
    priority: -100
    then:
      - logger.log: "ESP-01 AC Controller Ready"

# ESP-01 specific configuration
esp8266:
  board: esp01_1m
  framework:
    version: recommended
  
  # Memory optimizations
  restore_from_flash: true

# Minimal logging to save memory and avoid UART conflicts
logger:
  level: INFO
  # Disable serial logging since we're using UART for AC
  baud_rate: 0
  logs:
    uart: WARN
    sensor: WARN
    climate: INFO
    hisense_ac: INFO
    component: INFO

# Home Assistant API - REQUIRED for entity discovery
api:
  encryption:
    key: !secret api_encryption_key
  # Increase reboot timeout for stability
  reboot_timeout: 15min
  
  # Services for testing
  services:
    - service: query_ac_status
      then:
        - logger.log: "Manual AC status query requested"

# OTA Updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Fast connect saves memory
  fast_connect: true
  
  # Power save mode for ESP-01
  power_save_mode: LIGHT
  
  # Manual IP can help with connection issues
  # manual_ip:
  #   static_ip: 192.168.1.100
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  
  # Fallback AP
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

# Enable mDNS for discovery
mdns:
  disabled: false

# UART Configuration for ESP-01
# GPIO1 = TX, GPIO3 = RX (standard UART pins)
uart:
  id: ac_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE
  # Small buffer to save memory
  rx_buffer_size: 256

# Climate Component using external component
climate:
  - platform: hisense_ac
    id: ac_climate
    name: "${friendly_name}"
    uart_id: ac_uart
    
    # Sensors for monitoring
    compressor_frequency_sensor:
      name: "${friendly_name} Compressor"
      id: compressor_freq
      filters:
        - throttle: 30s  # Reduce update frequency
    
    outdoor_temperature_sensor:
      name: "${friendly_name} Outdoor Temp"
      id: outdoor_temp
      filters:
        - throttle: 60s
    
    pipe_temperature_sensor:
      name: "${friendly_name} Pipe Temp"
      id: pipe_temp
      filters:
        - throttle: 60s

# Minimal monitoring sensors
sensor:
  # WiFi signal for diagnostics
  - platform: wifi_signal
    name: "${friendly_name} WiFi"
    update_interval: 300s  # 5 minutes
    entity_category: diagnostic
  
  # Uptime sensor
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 300s
    entity_category: diagnostic
  
  # Free heap for memory monitoring
  - platform: template
    name: "${friendly_name} Free Memory"
    lambda: |-
      return ESP.getFreeHeap();
    unit_of_measurement: "bytes"
    update_interval: 60s
    entity_category: diagnostic
    icon: "mdi:memory"

# Status LED using GPIO2 (built-in LED on ESP-01S)
light:
  - platform: status_led
    name: "${friendly_name} Status"
    pin:
      number: GPIO2
      inverted: true
    internal: true  # Don't expose to HA to save resources

# Connection status
binary_sensor:
  - platform: status
    name: "${friendly_name} Connection"
    entity_category: diagnostic

# Minimal text sensors
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
      entity_category: diagnostic
  
  - platform: version
    name: "${friendly_name} Version"
    entity_category: diagnostic
    hide_timestamp: true

# Restart button for troubleshooting
button:
  - platform: restart
    name: "${friendly_name} Restart"
    entity_category: config

# Time component for scheduling (optional - comment out to save memory)
time:
  - platform: homeassistant
    id: ha_time

# Notes for ESP-01:
# - GPIO0: Boot mode selection (avoid using)
# - GPIO1: TX (used for AC communication)
# - GPIO2: Built-in LED (optional status indicator)
# - GPIO3: RX (used for AC communication)
# 
# Memory optimization tips:
# - Remove web_server component (not included)
# - Remove captive_portal (not included)
# - Minimal sensors and switches
# - Throttled sensor updates
# - No UART debug to save memory
# - Fast WiFi connect
# - Power save mode enabled