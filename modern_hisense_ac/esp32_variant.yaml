# ESP32-Specific Configuration for Hisense AC
# This file uses the external component structure

substitutions:
  device_name: hisense-ac-esp32
  friendly_name: "Hisense AC ESP32"

# External Components
external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

# Project Information
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Modern Hisense AC control via UART - ESP32"
  project:
    name: "hisense.ac_controller"
    version: "2.0.0"
  
  on_boot:
    priority: -100
    then:
      - logger.log: "Hisense AC Controller initialized"

# ESP32-specific configuration
esp32:
  board: esp32dev
  framework:
    type: arduino
    version: recommended

# Enable logging with proper levels
logger:
  level: INFO
  baud_rate: 0  # Disable UART logging to avoid conflicts
  logs:
    uart: DEBUG
    sensor: INFO
    climate: INFO

# Home Assistant API with encryption
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

# OTA Updates with password protection
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "Hisense-AC-ESP32-Fallback"
    password: !secret ap_password

captive_portal:

# Web Server for local control
web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# ESP32 optimized UART pins
uart:
  id: ac_uart
  tx_pin: GPIO17  # Can use any GPIO
  rx_pin: GPIO16  # Can use any GPIO
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_buffer_size: 512  # ESP32 can handle larger buffer

# Climate Component using external component
climate:
  - platform: hisense_ac
    name: "Hisense AC"
    id: ac_unit
    uart_id: ac_uart
    compressor_frequency_sensor:
      name: "Compressor Frequency"
      id: compressor_frequency
      unit_of_measurement: "Hz"
      device_class: frequency
      state_class: measurement
      accuracy_decimals: 0
    outdoor_temperature_sensor:
      name: "Outdoor Temperature"
      id: outdoor_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 0
    pipe_temperature_sensor:
      name: "Pipe Temperature"
      id: pipe_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 0

# Text Sensors
text_sensor:
  - platform: template
    name: "AC Power State"
    id: ac_power_state
    icon: "mdi:power"
  
  - platform: template
    name: "AC Current Mode"
    id: ac_current_mode
    icon: "mdi:air-conditioner"
  
  - platform: template
    name: "HVAC Action"
    id: hvac_action
    icon: "mdi:hvac"

# Binary Sensors
binary_sensor:
  - platform: template
    name: "Compressor Running"
    id: compressor_running
    device_class: running
    lambda: |-
      return id(compressor_frequency).state > 0;

# Additional ESP32 sensors
sensor:
  # ESP32 internal temperature sensor
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 60s
    
  # WiFi signal sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    
  # Uptime sensor
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# Switches
switch:
  - platform: restart
    name: "Restart ESP"
    icon: "mdi:restart"

# Button Components
button:
  - platform: template
    name: "Query Status"
    icon: "mdi:refresh"
    on_press:
      - uart.write:
          id: ac_uart
          data: [0xF4, 0xF5, 0x00, 0x40, 0x0C, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x66, 0x00, 0x00, 0x00, 0x01, 0xB3, 0xF4, 0xFB]

# ESP32 LED PWM support for status LED
output:
  - platform: ledc
    pin: GPIO2
    id: status_led
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: status_led
    name: "Status LED"
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 1s
          update_interval: 2s
      - strobe:
          name: "Fast Pulse"
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 100ms

# ESP32 can handle more frequent updates
interval:
  - interval: 1s  # Faster status updates
    then:
      - uart.write:
          id: ac_uart
          data: [0xF4, 0xF5, 0x00, 0x40, 0x0C, 0x00, 0x00, 0x01, 0x01, 0xFE, 0x01, 0x00, 0x00, 0x66, 0x00, 0x00, 0x00, 0x01, 0xB3, 0xF4, 0xFB]

# Advanced ESP32 features
esp32_ble_tracker:
  scan_parameters:
    active: false

# mDNS for easier discovery
mdns:
  disabled: false

# ESP32 supports Bluetooth proxy (optional)
# bluetooth_proxy:
