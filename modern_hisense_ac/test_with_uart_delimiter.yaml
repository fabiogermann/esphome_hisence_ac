# Test configuration with UART delimiter for better frame parsing
# This config uses the F4 FB delimiter to properly separate frames in logs

substitutions:
  device_name: hisense-ac-delimiter
  friendly_name: "Hisense AC Delimiter Test"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  
  on_boot:
    priority: -100
    then:
      - logger.log: "Device booted - using F4 FB delimiter for frame parsing"

# Board configuration
esp8266:
  board: esp01_1m
  framework:
    version: recommended

# Enable logging
logger:
  level: DEBUG
  logs:
    hisense_ac: DEBUG
    climate: INFO
    sensor: INFO
    uart: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

# Captive portal
captive_portal:

# Web server for debugging
web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# UART configuration with delimiter
uart:
  id: ac_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false
    # Use F4 FB as frame delimiter for cleaner logs
    after:
      delimiter: [0xF4, 0xFB]
    sequence:
      - lambda: |-
          // Log the complete frame
          UARTDebug::log_hex(direction, bytes);
          
          // Additional parsing for better visibility
          if (bytes.size() >= 4) {
            // Check if this is a complete frame
            if (bytes[0] == 0xF4 && bytes[1] == 0xF5 && 
                bytes[bytes.size()-2] == 0xF4 && bytes[bytes.size()-1] == 0xFB) {
              
              // Determine frame type
              const char* frame_type = "UNKNOWN";
              if (bytes[2] == 0x00) {
                frame_type = "COMMAND";
              } else if (bytes[2] == 0x01) {
                frame_type = "STATUS";
              }
              
              // Calculate and verify checksum
              size_t checksum_start = (bytes[2] == 0x01) ? 3 : 2;
              uint16_t calc_checksum = 0;
              for (size_t i = checksum_start; i < bytes.size() - 4; i++) {
                calc_checksum += bytes[i];
              }
              
              uint16_t recv_checksum = (bytes[bytes.size()-4] << 8) | bytes[bytes.size()-3];
              
              ESP_LOGD("uart_frame", "%s Frame - Length: %d, Checksum: %s (calc=0x%04X, recv=0x%04X)",
                       frame_type, bytes.size(),
                       (calc_checksum == recv_checksum) ? "OK" : "MISMATCH",
                       calc_checksum, recv_checksum);
            }
          }

# External component configuration
external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

# Climate component with all features
climate:
  - platform: hisense_ac
    id: ac_climate
    name: "${friendly_name}"
    uart_id: ac_uart
    
    # Optional: Flow control pin for RS485
    # flow_control_pin: GPIO4
    
    # Display control
    display_enabled: true
    
    # Optional sensors
    compressor_frequency_sensor:
      name: "${friendly_name} Compressor"
      id: compressor_freq
    outdoor_temperature_sensor:
      name: "${friendly_name} Outdoor Temp"
      id: outdoor_temp
    pipe_temperature_sensor:
      name: "${friendly_name} Pipe Temp"
      id: pipe_temp

# Additional diagnostic sensors
sensor:
  # WiFi signal sensor
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    
  # Uptime sensor
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    
  # Free heap to monitor memory
  - platform: template
    name: "${friendly_name} Free Heap"
    lambda: |-
      return ESP.getFreeHeap();
    unit_of_measurement: "bytes"
    update_interval: 30s
    icon: "mdi:memory"

# Status LED
light:
  - platform: status_led
    name: "${friendly_name} Status LED"
    pin:
      number: GPIO2
      inverted: true

# Binary sensor for connection status
binary_sensor:
  - platform: status
    name: "${friendly_name} Connection Status"

# Text sensors for diagnostics
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} Connected SSID"
  
  - platform: version
    name: "${friendly_name} ESPHome Version"
  
  # Custom text sensor for last frame info
  - platform: template
    name: "${friendly_name} Last Frame"
    id: last_frame_info
    icon: "mdi:message-text"

# Control buttons
button:
  - platform: restart
    name: "${friendly_name} Restart"
    
  - platform: template
    name: "${friendly_name} Query Status"
    on_press:
      - logger.log: "Manual status query triggered"
      - lambda: |-
          auto *climate_component = id(ac_climate);
          climate_component->query_status();
      
  - platform: template
    name: "${friendly_name} Toggle Display"
    on_press:
      - lambda: |-
          auto *climate_component = id(ac_climate);
          bool current = climate_component->get_display_enabled();
          climate_component->set_display_enabled(!current);
          ESP_LOGD("button", "Display toggled to: %s", !current ? "ON" : "OFF");

# Switches for additional control
switch:
  - platform: template
    name: "${friendly_name} Display"
    id: display_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          id(ac_climate)->set_display_enabled(true);
    on_turn_off:
      - lambda: |-
          id(ac_climate)->set_display_enabled(false);
  
  # Debug switch to log frame statistics
  - platform: template
    name: "${friendly_name} Frame Debug"
    id: frame_debug
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# Time component for scheduling
time:
  - platform: homeassistant
    id: homeassistant_time

# Interval to log frame statistics
interval:
  - interval: 30s
    then:
      - if:
          condition:
            switch.is_on: frame_debug
          then:
            - logger.log:
                format: "Frame statistics logged"
                level: INFO